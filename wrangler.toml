name = "subscription-notifier"
main = "src/worker.js"
compatibility_date = "2024-05-01"
compatibility_flags = ["nodejs_compat"]

# Cron 定时任务
# 1. 每10分钟检查并发送通知
# 2. 每1分钟同步服务器时间
[triggers]
crons = ["*/10 * * * *", "* * * * *"]

# 日志配置
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true