name = "subnotify"
main = "src/worker.js"
compatibility_date = "2024-05-01"
compatibility_flags = ["nodejs_compat"]

# Cron 定时任务
# 每10分钟检查并发送通知
[triggers]
crons = ["*/10 * * * *"]

# KV 存储（可选，用于存储服务器时间）
# 在 Cloudflare Dashboard 创建 KV 命名空间后取消注释
# [[kv_namespaces]]
# binding = "KV"
# id = "YOUR_KV_NAMESPACE_ID"

# 日志配置
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true