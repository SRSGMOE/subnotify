name = "subscription-notifier"
main = "src/index.js"
compatibility_date = "2024-01-01"

# 敏感信息通过 Cloudflare Dashboard 的环境变量/Secrets 设置
# 不要在此文件中填写 Token 和 Chat ID

[[d1_databases]]
binding = "DB"
database_name = "subscription-db"
# database_id 需要在 Cloudflare Dashboard 中创建 D1 后填入
database_id = "YOUR_DATABASE_ID"

[triggers]
crons = ["0 9 * * *"]